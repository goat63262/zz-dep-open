name: zz-bot-approve
on:
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to approve
        required: true
permissions:
  pull-requests: write
  contents: read
jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - name: approve as github-actions[bot]
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
        run: gh pr review "$PR" --approve -b "automated approval from github-actions[bot]"
